<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Dahab Spots & Chill</title>
    <style>
        body, html { 
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            /* Aerial view of Dahab background */
            background: url('862512681_3297789707276033_1977711763341300717_n.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); /* Dark overlay to make the card pop */
            z-index: 1;
        }
        .content-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 85%;
            width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { 
            margin: 0 0 10px 0;
            color: #2c3e50; 
            font-size: 1.5rem;
        }
        .message { 
            font-size: 1rem; 
            color: #555;
            line-height: 1.5; 
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #009688; /* Sea-teal color to match Dahab vibe */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn { 
            display: inline-block; 
            padding: 12px 25px; 
            background-color: #009688; 
            color: white; 
            text-decoration: none; 
            border-radius: 25px; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #00796b; }
    </style>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var androidLink = "https://play.google.com/store/apps/details?id=com.dahab.guide";
            var iosLink = ""; 
            var statusDiv = document.getElementById("status");
            var spinnerDiv = document.getElementById("spinner");

            // 1. Detect iOS
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                if (iosLink) {
                    window.location.href = iosLink;
                } else {
                    spinnerDiv.style.display = "none";
                    statusDiv.innerHTML = "Our iOS app is dropping very soon! 🍎<br><br>For now, grab a friend with an Android to explore Dahab spots offline.";
                }
            } 
            // 2. Detect Android
            else if (/android/i.test(userAgent)) {
                window.location.href = androidLink;
            } 
            // 3. Desktop / Web Fallback
            else {
                spinnerDiv.style.display = "none";
                statusDiv.innerHTML = "You're on a desktop. Scan the QR code on the sticker with your phone, or click below.<br><br><a href='" + androidLink + "' class='btn'>View on Google Play</a>";
            }
        };
    </script>
</head>
<body>
    <div class="overlay"></div>
    <div class="content-box">
        <!-- App Logo -->
        <img src="Gemini_Generated_Image_mfatsjmfatsjmfat.jpg" alt="Dahab Spots Logo" class="logo">
        <h2>Dahab Spots & Chill</h2>
        <div id="spinner" class="spinner"></div>
        <div id="status" class="message">Redirecting you to the app... 🚀</div>
    </div>
</body>
</html>
