<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Dahab Spots & Chill</title>
    
    <!-- 1. INSTANT REDIRECT LOGIC: Runs immediately before anything else loads -->
    <script>
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var androidLink = "https://play.google.com/store/apps/details?id=com.dahab.guide";
        var iosLink = ""; // Paste App Store link here later
        
        if (/android/i.test(userAgent)) {
            window.location.replace(androidLink);
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream && iosLink) {
            window.location.replace(iosLink);
        }
    </script>

    <!-- 2. STYLES: Only processed if the user didn't get redirected above -->
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; align-items: center; justify-content: center;
            background: url('862512681_3297789707276033_1977711763341300717_n.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); z-index: 1;
        }
        .content-box {
            position: relative; z-index: 2; background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px; border-radius: 20px; text-align: center;
            max-width: 85%; width: 320px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .logo {
            width: 90px; height: 90px; border-radius: 18px; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { margin: 0 0 10px 0; color: #2c3e50; font-size: 1.5rem; }
        .message { font-size: 1rem; color: #555; line-height: 1.5; margin-bottom: 20px; }
        .btn { 
            display: inline-block; padding: 12px 25px; background-color: #009688; 
            color: white; text-decoration: none; border-radius: 25px; font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 3. FALLBACK UI: Only shown to iOS (for now) or Desktop users -->
    <div class="overlay"></div>
    <div class="content-box">
        <img src="Gemini_Generated_Image_mfatsjmfatsjmfat.jpg" alt="Dahab Spots Logo" class="logo">
        <h2>Dahab Spots & Chill</h2>
        <div id="status" class="message">Loading...</div>
    </div>

    <!-- 4. FALLBACK LOGIC: Updates the UI text based on the device -->
    <script>
        var statusDiv = document.getElementById("status");
        var uaCheck = navigator.userAgent || navigator.vendor || window.opera;
        
        if (/iPad|iPhone|iPod/.test(uaCheck) && !window.MSStream && !iosLink) {
            statusDiv.innerHTML = "Our iOS app is dropping very soon! 🍎<br><br>For now, grab a friend with an Android to explore Dahab spots offline.";
        } else {
            statusDiv.innerHTML = "You're on a desktop. Scan the sticker QR code with your phone, or click below.<br><br><a href='" + androidLink + "' class='btn'>View on Google Play</a>";
        }
    </script>
</body>
</html>
