<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Dahab Spots & Chill</title>

    <!-- 1. INSTANT REDIRECT + REFERRAL TRACKING LOGIC -->
    <script>
        var params = new URLSearchParams(window.location.search);
        var rawRef = params.get("ref") || "direct";
        var safeRef = encodeURIComponent(rawRef);

        // Google Play tracks utm_source automatically in Play Console
        var androidLink = "https://play.google.com/store/apps/details?id=com.dahab.guide&referrer=utm_source%3D" + safeRef;

        // Apple App Store requires your Provider Token (pt) for Campaign (ct) tracking to register
        var appleProviderToken = "129773529"; // <-- بدّل دي برقم الـ pt بتاعك من App Store Connect
        var iosBase = "https://apps.apple.com/us/app/dahab-spots-chill/id6832980894";
        var iosLink = (appleProviderToken !== "YOUR_PT_HERE" && appleProviderToken !== "")
            ? iosBase + "?pt=" + encodeURIComponent(appleProviderToken) + "&ct=" + safeRef + "&mt=8"
            : iosBase;

        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isIOS = (/iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && !window.MSStream;

        if (/android/i.test(userAgent)) {
            window.location.replace(androidLink);
        } else if (isIOS) {
            window.location.replace(iosLink);
        }
    </script>

    <!-- 2. STYLES -->
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; align-items: center; justify-content: center;
            background: url('862512681_3297789707276033_1977711763341300717_n.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); z-index: 1;
        }
        .content-box {
            position: relative; z-index: 2; background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px; border-radius: 20px; text-align: center;
            max-width: 85%; width: 320px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .logo {
            width: 90px; height: 90px; border-radius: 18px; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .qr-image {
            width: 140px; height: 140px; margin: 15px auto; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: block;
        }
        h2 { margin: 0 0 10px 0; color: #2c3e50; font-size: 1.5rem; }
        .message { font-size: 1rem; color: #555; line-height: 1.5; margin-bottom: 20px; }
        .btn { 
            display: block; padding: 12px 25px; margin-bottom: 12px;
            background-color: #009688; color: white; text-decoration: none; 
            border-radius: 25px; font-weight: bold; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-ios { background-color: #000000; }
    </style>
</head>
<body>
    <!-- 3. FALLBACK UI -->
    <div class="overlay"></div>
    <div class="content-box">
        <img src="Gemini_Generated_Image_mfatsjmfatsjmfat.jpg" alt="Dahab Spots Logo" class="logo">
        <h2>Dahab Spots & Chill</h2>
        <div id="status" class="message">Loading...</div>
    </div>

    <!-- 4. FALLBACK LOGIC -->
    <script>
        var statusDiv = document.getElementById("status");
        var uaCheck = navigator.userAgent || navigator.vendor || window.opera;
        var isIOSFallback = (/iPad|iPhone|iPod/.test(uaCheck) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && !window.MSStream;

        if (isIOSFallback) {
            statusDiv.innerHTML = "Click below to get the iOS app.<br><br><a href='" + iosLink + "' class='btn btn-ios'>Download on the App Store</a>";
        } else if (/android/i.test(uaCheck)) {
            statusDiv.innerHTML = "Click below to get the Android app.<br><br><a href='" + androidLink + "' class='btn'>Get it on Google Play</a>";
        } else {
            statusDiv.innerHTML = "You're on a desktop. Scan the QR code below with your phone.<br><img src='qr-code.png' alt='Scan to download' class='qr-image'><br><a href='" + iosLink + "' class='btn btn-ios'>App Store (iOS)</a><a href='" + androidLink + "' class='btn'>Google Play (Android)</a>";
        }
    </script>
</body>
</html>
